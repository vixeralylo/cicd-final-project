apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: output
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -e
        echo "Cleaning up workspace..."
        rm -rf $(workspaces.output.path)/*
        echo "Cleanup complete."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: output
  steps:
    - name: flake8
      image: python:3.9-slim
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -e
        pip install --upgrade pip
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test
spec:
  workspaces:
    - name: output
  steps:
    - name: nose-test
      image: python:3.9-slim
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -e
        pip install --upgrade pip
        pip install nose2
        python -m nose2 -v
